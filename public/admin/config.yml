backend:
  name: github
  repo: meinrehlein/jrweb
  brannch: version9

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/data/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"

    # Use 'name' (or title) as the main line
    identifier_field: "name"   # or "name" if you prefer

    # 👇 Shows extra info right under the identifier in the list
    summary: "{{name}} Kind:{{kind}} Category:{{category}} online:{{online}}"
    sortable_fields: ["commit_date", "updated", "created", "order_about", "order_projects", "order_video", "order_secondary", "title"]
    # Optional: make search hit more fields
    search_fields: ["title", "name", "category", "kind", "body", "body_en", "location"]

    # Optional: quick filters in the UI
    view_filters:
      - { label: "Category A", field: "category", pattern: "A" }
      - { label: "Category B", field: "category", pattern: "B" }

      - { label: "Kind: Text", field: "kind", pattern: "text" }
      - { label: "Kind: Image", field: "kind", pattern: "image" }
      - { label: "Kind: Video", field: "kind", pattern: "video" }

      - { label: "Offline", field: "online", pattern: false }
      - { label: "Online", field: "online", pattern: true }

    # Optional: group chips
    view_groups:
      - { label: "By Category", field: "category" }
      - { label: "By Kind", field: "kind" }

    # …your existing fields stay the same…
    fields:
      - { label: "Online", name: "online", widget: "boolean", default: true }
      - { label: "Title", name: "title", widget: "string", required: false }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Alt Text", name: "alt", widget: "string" }
      - { label: "Video (URL or HLS)", name: "video", widget: "string", required: false }
      - { label: "Start Time (seconds)", name: "startTime", widget: "number", required: false, value_type: "int" }
      - { label: "Kind", name: "kind", widget: "select", options: ["image", "text", "video"], default: "image" }
      - { label: "Aspect Ratio (e.g. 1 / 1.417)", name: "aspectRatio", widget: "string", required: false }
      - { label: "Order (About)", name: "order_about", widget: "number", value_type: "int", default: 0 }
      - { label: "Order (Projects)", name: "order_projects", widget: "number", value_type: "int", default: 0 }
      - { label: "Order (Video)", name: "order_video", widget: "number", value_type: "int", default: 0 }
      - { label: "Order (Secondary)", name: "order_secondary", widget: "number", value_type: "int", default: 0 }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "A", value: "A" }
          - { label: "B", value: "B" }
          - { label: "C", value: "C" }
        default: "B"
      - { label: "Body (default)", name: "body", widget: "markdown", required: false }
      - { label: "Body (EN)", name: "body_en", widget: "markdown", required: false }
      - { label: "Created", name: "created", widget: "hidden", default: "{{commit_date}}" }
      - { label: "Updated", name: "updated", widget: "hidden", default: "{{commit_date}}" }
